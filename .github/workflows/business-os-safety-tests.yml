name: Business OS safety tests

on:
  push:
    branches: ["business-os/blueprint"]
    paths:
      - "business-os/**"
      - ".github/workflows/business-os-safety-tests.yml"
  pull_request:
    branches: ["business-os/blueprint"]
    paths:
      - "business-os/**"
      - ".github/workflows/business-os-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate JSON schemas and fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root = Path("business-os/contracts")
          cases = [
              ("task-envelope.schema.json", "fixtures/task-valid.json", True),
              ("task-envelope.schema.json", "fixtures/task-invalid-unknown-field.json", False),
              ("approval-envelope.schema.json", "fixtures/approval-valid.json", True),
              ("approval-envelope.schema.json", "fixtures/approval-invalid-bad-hash.json", False),
          ]
          for schema_name, fixture_name, expected in cases:
              schema = json.loads((root / schema_name).read_text())
              fixture = json.loads((root / fixture_name).read_text())
              Draft202012Validator.check_schema(schema)
              valid = Draft202012Validator(schema, format_checker=FormatChecker()).is_valid(fixture)
              assert valid is expected, f"{fixture_name}: expected valid={expected}, got {valid}"
              print(f"PASS {fixture_name}")
          PY
      - name: Run isolated guardrail tests
        working-directory: business-os/control_plane
        run: python -m unittest -v
