name: Business OS safety tests

on:
  push:
    branches: ["business-os/blueprint"]
    paths:
      - "business-os/**"
      - "scripts/bootstrap-business-os-openclaw.sh"
      - "scripts/test-bootstrap-business-os-openclaw.sh"
      - ".github/workflows/business-os-safety-tests.yml"
  pull_request:
    branches: ["main", "business-os/blueprint"]
    paths:
      - "business-os/**"
      - "scripts/bootstrap-business-os-openclaw.sh"
      - "scripts/test-bootstrap-business-os-openclaw.sh"
      - ".github/workflows/business-os-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate JSON schemas and fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root = Path("business-os/contracts")
          cases = [
              ("task-envelope.schema.json", "fixtures/task-valid.json", True),
              ("task-envelope.schema.json", "fixtures/task-valid-budget.json", True),
              ("task-envelope.schema.json", "fixtures/task-invalid-budget-fractional.json", False),
              ("task-envelope.schema.json", "fixtures/task-invalid-unknown-field.json", False),
              ("approval-envelope.schema.json", "fixtures/approval-valid.json", True),
              ("approval-envelope.schema.json", "fixtures/approval-invalid-bad-hash.json", False),
          ]
          for schema_name, fixture_name, expected in cases:
              schema = json.loads((root / schema_name).read_text())
              fixture = json.loads((root / fixture_name).read_text())
              Draft202012Validator.check_schema(schema)
              valid = Draft202012Validator(schema, format_checker=FormatChecker()).is_valid(fixture)
              assert valid is expected, f"{fixture_name}: expected valid={expected}, got {valid}"
              print(f"PASS {fixture_name}")
          PY
      - name: Validate runtime configuration and bootstrap syntax
        run: |
          python -m pip install --disable-pip-version-check json5==0.12.0 PyYAML==6.0.2
          python - <<'PY'
          import json
          from pathlib import Path
          import json5
          import yaml

          root = Path("business-os")
          json.loads((root / "config/agent-manifest.json").read_text())
          json.loads((root / "config/runbooks.json").read_text())
          yaml.safe_load((root / "config/system.yaml").read_text())
          yaml.safe_load((root / "config/tool-permissions.yaml").read_text())
          config = json5.loads((root / "runtime/openclaw/openclaw.json5.example").read_text())
          assert isinstance(config, dict), "OpenClaw example must be an object"

          # Assert the actual least-privilege policy, not only JSON5 syntax.
          tools = config["tools"]
          forbidden = {"exec", "process", "apply_patch", "message", "browser", "gateway",
                       "cron", "automations", "openclaw", "nodes", "computer", "sessions_send", "plugins"}
          assert forbidden.issubset(set(tools["deny"]))
          assert not (forbidden & set(tools["gatewayPolicy"]["allow"]))
          assert not (forbidden & set(tools["sandbox"]["tools"]["allow"]))
          assert tools["agentToAgent"]["enabled"] is False
          assert tools["sessions"]["visibility"] == "tree"
          assert tools["elevated"]["enabled"] is False
          assert config["cron"]["enabled"] is False
          assert config["commands"]["restart"] is False

          sandbox = config["agents"]["defaults"]["sandbox"]
          assert sandbox["mode"] == "all" and sandbox["backend"] == "docker"
          assert sandbox["scope"] == "agent" and sandbox["workspaceAccess"] == "rw"
          assert sandbox["docker"]["network"] == "none"
          assert sandbox["docker"]["readOnlyRoot"] is True
          assert set(sandbox["docker"]["capDrop"]) == {"ALL"}

          agents = config["agents"]["entries"]
          orchestrator = "business-os-orchestrator"
          assert len(agents) == 9 and orchestrator in agents
          expected_children = set(agents) - {orchestrator}
          assert set(agents[orchestrator]["subagents"]["allowAgents"]) == expected_children
          for agent_id, agent in agents.items():
              if agent_id != orchestrator:
                  assert agent["subagents"]["allowAgents"] == []
          assert not config.get("channels") and not config.get("plugins")
          print("PASS JSON, YAML, JSON5 syntax and OpenClaw least-privilege policy")
          PY
          bash -n scripts/bootstrap-business-os-openclaw.sh
          bash -n scripts/test-bootstrap-business-os-openclaw.sh
          bash scripts/test-bootstrap-business-os-openclaw.sh
      - name: Run isolated guardrail tests
        working-directory: business-os/control_plane
        run: python -m unittest -v
      - name: Run synthetic durable control-plane end-to-end test
        working-directory: business-os/control_plane
        run: python synthetic_e2e.py
